services:
  metabase:
    image: ghcr.io/motherduckdb/metabase-duckdb:latest
    container_name: kirana-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
      - ./db:/data/db:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  drawio:
    image: jgraph/drawio:32.6.1
    container_name: kirana-drawio
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  metabase_data:
